name: release-please

on:
  push:
    branches:
      - main

permissions:
  contents: write
  issues: write
  pull-requests: write

jobs:
  release-please:
    runs-on: ubuntu-latest
    steps:
      # Tags/PRs created with GITHUB_TOKEN don't trigger ci.yaml (tag publish/goreleaser),
      # so prefer a PAT when RELEASE_PLEASE_TOKEN is configured.
      - uses: googleapis/release-please-action@v4
        with:
          token: ${{ secrets.RELEASE_PLEASE_TOKEN || secrets.GITHUB_TOKEN }}
